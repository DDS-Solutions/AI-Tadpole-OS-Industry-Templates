name: Validate Swarm Templates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.10'

    - name: Run template validation scripts
      run: |
        python scripts/verify_compatibility_lock.py
        python scripts/migrate_consumer_contract.py --check
        python scripts/validate_template.py
        python -m unittest discover -s tests -p 'test_*.py'

  builder:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: web-builder/package-lock.json

    - name: Install locked dependencies
      working-directory: web-builder
      run: npm ci

    - name: Lint
      working-directory: web-builder
      run: npm run lint

    - name: Test archive contracts
      working-directory: web-builder
      run: npm run test

    - name: Build
      working-directory: web-builder
      run: npm run build
