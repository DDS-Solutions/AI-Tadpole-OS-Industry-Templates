name: Validate Swarm Templates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

    - name: Run template validation scripts
      run: |
        python scripts/verify_compatibility_lock.py
        python scripts/migrate_consumer_contract.py --check
        python scripts/validate_template.py
        python -m unittest discover -s tests -p 'test_*.py'

  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: web-builder/package-lock.json

    - name: Install locked dependencies
      working-directory: web-builder
      run: npm ci

    - name: Lint
      working-directory: web-builder
      run: npm run lint

    - name: Test archive contracts
      working-directory: web-builder
      run: npm run test

    - name: Build
      working-directory: web-builder
      run: npm run build
