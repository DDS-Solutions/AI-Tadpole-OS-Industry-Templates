name: Validate Swarm Templates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run template validation scripts
      run: |
        python scripts/migrate_consumer_contract.py --check
        python scripts/validate_template.py
        python -m unittest discover -s tests -p 'test_*.py'

  builder:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: web-builder/package-lock.json

    - name: Install locked dependencies
      working-directory: web-builder
      run: npm ci

    - name: Lint
      working-directory: web-builder
      run: npm run lint

    - name: Test archive contracts
      working-directory: web-builder
      run: npm run test

    - name: Build
      working-directory: web-builder
      run: npm run build
