name: Validate Swarm Templates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Run template validation scripts
      run: |
        python scripts/verify_compatibility_lock.py
        python scripts/migrate_consumer_contract.py --check
        python scripts/validate_template.py
        python -m unittest discover -s tests -p 'test_*.py'

  builder:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: web-builder/package-lock.json

    - name: Install locked dependencies
      working-directory: web-builder
      run: npm ci

    - name: Lint
      working-directory: web-builder
      run: npm run lint

    - name: Test archive contracts
      working-directory: web-builder
      run: npm run test

    - name: Build
      working-directory: web-builder
      run: npm run build
