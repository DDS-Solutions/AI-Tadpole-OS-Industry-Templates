name: Deploy Swarm Architect

on:
  push:
    branches: ["main"]
    paths:
      - 'web-builder/**'
      - 'registry.json'
      - 'index.json'
      - 'mcp_registry.json'
      - 'mcp-blueprints/**'
      - '*/**/swarm.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run contract validation and tests
        run: |
          python scripts/verify_compatibility_lock.py
          python scripts/migrate_consumer_contract.py --check
          python scripts/validate_template.py
          python -m unittest discover -s tests -p 'test_*.py'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-builder/package-lock.json

      - name: Install dependencies
        working-directory: web-builder
        run: npm ci

      - name: Lint
        working-directory: web-builder
        run: npm run lint

      - name: Strict typecheck
        working-directory: web-builder
        run: npm run typecheck

      - name: Test archive contracts
        working-directory: web-builder
        run: npm run test

      - name: Build
        working-directory: web-builder
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './web-builder/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
