name: Deploy Swarm Architect

on:
  push:
    branches: ["main", "security-hardening"]
    paths:
      - 'web-builder/**'
      - 'registry.json'
      - 'mcp_registry.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-builder/package-lock.json

      - name: Install dependencies
        working-directory: web-builder
        run: npm ci

      - name: Lint
        working-directory: web-builder
        run: npm run lint

      - name: Test archive contracts
        working-directory: web-builder
        run: npm run test

      - name: Build
        working-directory: web-builder
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v4.2.1
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './web-builder/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db9015773603e69213339344482112769047d7 # v4.0.5
