name: Sapphire Shield Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-policy:
    name: Package Policy and Source Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Validate package security boundaries and lockfile
        run: |
          python scripts/verify_compatibility_lock.py
          python scripts/validate_template.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Install pinned Python source scanner
        run: python -m pip install --disable-pip-version-check bandit==1.9.4

      - name: Scan executable template, scripts, tests, and connector source
        run: |
          bandit -r scripts tests mcp-blueprints validate.py -ll -ii
          find . -path '*/skills/*.py' -print0 | xargs -0 -r bandit -ll -ii

  malware-scan:
    name: ClamAV Malware Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-daemon

      - name: Update ClamAV Database
        run: |
          sudo systemctl stop clamav-freshclam || true
          if ! sudo freshclam --stdout; then
            echo "::warning::freshclam mirror rate-limited or transiently unavailable; verifying existing definition state..."
          fi
          test -d /var/lib/clamav && ls -la /var/lib/clamav || true

      - name: Scan Files
        run: |
          clamscan --recursive --infected . --exclude-dir=node_modules --exclude-dir=.git
