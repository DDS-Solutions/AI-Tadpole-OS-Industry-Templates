name: Sapphire Shield Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-policy:
    name: Package Policy and Source Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate package security boundaries
        run: |
          python scripts/validate_template.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Install pinned Python source scanner
        run: python -m pip install --disable-pip-version-check bandit==1.9.4

      - name: Scan executable template and connector source
        run: |
          bandit -r mcp-blueprints -ll -ii
          find . -path '*/skills/*.py' -print0 | xargs -0 -r bandit -ll -ii

  malware-scan:
    name: ClamAV Malware Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-daemon

      - name: Update ClamAV Database
        run: |
          sudo freshclam

      - name: Scan Files
        run: |
          clamscan --recursive --infected . --exclude-dir=node_modules --exclude-dir=.git
